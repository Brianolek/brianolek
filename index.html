<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brian Olek</title>
<meta name="description" content="Brian Olek, painter.">
<meta property="og:title" content="Brian Olek">
<meta property="og:description" content="Brian Olek, painter.">
<meta property="og:image" content="img/full/w02.webp">
<meta name="theme-color" content="#070707">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23070707'/><circle cx='16' cy='16' r='7' fill='%23d1232b'/></svg>">
</head>
<body>

<svg class="defs" aria-hidden="true" width="0" height="0">
  <filter id="vblur" x="-20%" y="-40%" width="140%" height="180%">
    <feGaussianBlur stdDeviation="0 22"/>
  </filter>
</svg>

<div class="progress" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="cursor" aria-hidden="true"></div>

<header class="top">
  <a class="wordmark" href="#top">Brian Olek</a>
  <nav class="nav" aria-label="Main">
    <a href="#work">Work</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<main id="top">

  <section class="hero" aria-label="Introduction">
    <canvas class="smear" id="smear"></canvas>
    <div class="hero-copy">
      <h1 class="name" data-smear>Brian Olek</h1>
      <p class="lede">man living in world</p>
    </div>
  </section>

  <section class="work" id="work">
    <div class="work-head">
      <div class="views" role="group" aria-label="View">
        <button class="chip is-on" data-view="flow">Flow</button>
        <button class="chip" data-view="grid">Grid</button>
      </div>
    </div>
    <div class="counter" aria-hidden="true"><span id="counterNow">01</span><span class="counter-sep">/</span><span id="counterAll">30</span></div>
    <div class="works flow" id="works"></div>
  </section>

  <section class="contact" id="contact">
    <div class="contact-inner">
      <a class="mail" href="mailto:briandolek@gmail.com">briandolek@gmail.com</a>
    </div>
  </section>

</main>

<footer class="foot">
  <span>© <span id="year"></span> Brian Olek</span>
  <a href="#top" class="foot-top">Top</a>
</footer>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Painting" hidden>
  <button class="viewer-close" id="viewerClose" aria-label="Close">×</button>
  <button class="viewer-nav prev" id="viewerPrev" aria-label="Previous">←</button>
  <button class="viewer-nav next" id="viewerNext" aria-label="Next">→</button>
  <figure class="viewer-fig">
    <img class="viewer-img" id="viewerImg" alt="">
  </figure>
</div>

<script src="js/smear.js"></script>
<script src="js/main.js"></script>
</body>
</html>
