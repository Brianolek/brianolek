name: Rebuild Anna's calendar feed

on:
  push:
    branches: [main]
    paths:
      - 'anna/data/**'
      - 'anna/js/engine.js'
      - 'anna/tools/build_calendar.mjs'
  schedule:
    - cron: '17 5 * * *'   # daily, keeps the 8-week horizon rolling forward
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node anna/tools/build_calendar.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add anna/calendar.ics
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "anna: rebuild calendar.ics [skip ci]"
          git push
